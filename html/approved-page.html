<!DOCTYPE html>
<!--
  Página exibida após "Aprovar". Renderizada pelo nó Code "Render Approved Page".
  Tokens: {{IMAGE_URL}} {{STYLE}} {{OUTPUT_FOLDER}} {{ITERATION}}
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset aprovado</title>
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#2a2f3d; --text:#e7e9ee; --muted:#9aa3b2; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { max-width:560px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; text-align:center; }
  img { max-width:220px; border-radius:8px; background:#fff; }
  h1 { font-size:22px; margin:16px 0 6px; color:var(--ok); }
  p { color:var(--muted); margin:6px 0; }
  code { color:var(--text); background:#0c0e14; border:1px solid var(--line); border-radius:6px; padding:2px 6px; word-break:break-all; }
  .spin { width:28px; height:28px; margin:18px auto 0; border:3px solid var(--line); border-top-color:var(--ok);
          border-radius:50%; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <img src="{{IMAGE_URL}}" alt="Imagem aprovada">
    <h1>✔ Aprovado na iteração #{{ITERATION}}</h1>
    <p>Removendo o fundo e gerando o modelo 3D (<b>{{STYLE}}</b>). Isso leva alguns minutos.</p>
    <p>O <code>.glb</code> e o <code>.png</code> sem fundo serão salvos em <code>{{OUTPUT_FOLDER}}</code>.</p>
    <p>Você pode fechar esta aba — acompanhe em <b>Executions</b> no n8n.</p>
    <div class="spin"></div>
  </div>
</body>
</html>
